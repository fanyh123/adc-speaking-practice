'use strict';
const payload=JSON.parse(document.getElementById('encrypted').textContent);
const sessionKey='adc-voice-samples-unlock-v1';
const decode=text=>Uint8Array.from(atob(text),char=>char.charCodeAt(0));
async function decryptWithKey(key){const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.nonce),additionalData:new TextEncoder().encode('adc-speaking-v1')},key,decode(payload.ciphertext));return new TextDecoder().decode(bytes);}
function openLesson(html){if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>openLesson(html),{once:true});return;}document.open();document.write(html);document.close();}
document.getElementById('showPassword').onclick=()=>{const input=document.getElementById('password');const visible=input.type==='password';input.type=visible?'text':'password';document.getElementById('showPassword').textContent=visible?'隐藏口令':'显示口令';document.getElementById('showPassword').setAttribute('aria-pressed',String(visible));};
document.getElementById('unlockForm').onsubmit=async event=>{
event.preventDefault();const button=document.getElementById('unlock'),message=document.getElementById('message');
if(!window.isSecureContext||!crypto.subtle){message.textContent='当前浏览器无法解锁，请使用 HTTPS 地址并在 Safari、Chrome 或 Edge 中打开。';return;}
button.disabled=true;button.textContent='正在解锁…';message.textContent='';
try{const password=document.getElementById('password').value.trim();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);const html=await decryptWithKey(key);if(document.getElementById('remember').checked){try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));sessionStorage.setItem(sessionKey,btoa(String.fromCharCode(...raw)));}catch{}}else{try{sessionStorage.removeItem(sessionKey);}catch{}}openLesson(html);}
catch{message.textContent='口令不正确，或页面未完整加载。请检查大小写和字符，再试一次。';button.disabled=false;button.textContent='进入音色试听 →';}
};
(async()=>{if(!window.isSecureContext||!crypto.subtle)return;let stored;try{stored=sessionStorage.getItem(sessionKey);}catch{return;}if(!stored)return;try{const key=await crypto.subtle.importKey('raw',decode(stored),{name:'AES-GCM'},false,['decrypt']);openLesson(await decryptWithKey(key));}catch{try{sessionStorage.removeItem(sessionKey);}catch{}}})();
</script></body></html>
